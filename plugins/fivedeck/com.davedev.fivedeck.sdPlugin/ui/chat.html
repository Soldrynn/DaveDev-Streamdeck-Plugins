<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chat Message settings</title>
  <link rel="stylesheet" href="fivedeck.css">
  <script src="sdpi-components.js"></script>
</head>
<body>
<sdpi-item label="Message">
    <sdpi-textarea setting="message" rows="3" placeholder="brb, grabbing a coffee"></sdpi-textarea>
  </sdpi-item>
  <sdpi-item>
    <small class="fd-note">This action deliberately types into chat. Each line is sent as its own message. Chat commands such as <code>/me</code> or <code>/ooc</code> work too.</small>
  </sdpi-item>
  <sdpi-item label="Send">
    <sdpi-checkbox setting="send" label="Send immediately (off leaves the last line open to edit)" default="true"></sdpi-checkbox>
  </sdpi-item>
  <details class="fd-advanced">
    <summary>Keyboard input (Chat Message &amp; Game Key)</summary>
  <sdpi-item label="Focus">
    <sdpi-checkbox setting="focusGame" label="Bring FiveM to the front before sending keys" global></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item label="Chat key">
    <sdpi-select setting="chatKey" default="T" global>
      <option value="T">T</option>
      <option value="Y">Y</option>
      <option value="U">U</option>
      <option value="RETURN">Enter</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="Input delay">
    <sdpi-range setting="inputDelayMs" min="30" max="600" step="10" default="90" global showlabels></sdpi-range>
  </sdpi-item>
  <sdpi-item label="Compatibility">
    <sdpi-checkbox setting="scanCodeOnly" label="Send scan codes only" global></sdpi-checkbox>
  </sdpi-item>
  <sdpi-item>
    <small class="fd-note">These actions send keyboard input only while a FiveM window is active. These settings do not affect direct commands.</small>
  </sdpi-item>
  </details>
  <script src="fivedeck.js"></script>
</body>
</html>
