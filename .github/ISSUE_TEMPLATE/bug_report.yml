name: Bug report
description: Report a reproducible problem with a plugin.
labels: ["bug"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - Clef
        - FiveDeck
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin, Stream Deck, and Windows versions. For FiveDeck, add the FiveM or FXServer build if it matters.
      placeholder: FiveDeck 0.1.0.0, Stream Deck 7.1, Windows 11 24H2, FXServer 17000
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the action and its settings. Never paste passwords, RCON passwords, or license keys.
      placeholder: |
        1. Add the Game Command action with `e dance`
        2. Focus FiveM and press the key
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Plugin log (optional)
      description: Paste the relevant lines from the plugin's `logs` folder. Remove anything private first.
      render: text
