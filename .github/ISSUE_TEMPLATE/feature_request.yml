name: Feature request
description: Suggest a focused improvement for a plugin.
labels: ["enhancement"]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options:
        - Clef
        - A new plugin
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and why the current plugin makes it hard.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
