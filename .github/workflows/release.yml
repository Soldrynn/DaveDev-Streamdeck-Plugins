name: Draft Clef release

# A new plugin-scoped tag builds a new draft only. Historical tags are never moved.
on:
  push:
    tags: ["clef-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require source already merged into main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release source must already be on main.' }
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/clef/package-lock.json
      - name: Validate the tag against every version source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/validate-release-tag.mjs "$env:RELEASE_TAG"
      - name: Test release validation
        run: node --test scripts/tests/*.test.mjs
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Install and audit dependencies
        working-directory: plugins/clef
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit signatures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --audit-level=moderate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, test, validate, and package
        working-directory: plugins/clef
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/smoke-helper-ipc.ps1
          npm run check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run validate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record installer checksum and source
        working-directory: plugins/clef/dist
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem -File -Filter *.streamDeckPlugin)
          if ($files.Count -ne 1) { throw "Expected one installer, found $($files.Count)." }
          $hash = (Get-FileHash $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($files[0].Name)" | Out-File -Encoding ascii SHA256SUMS.txt
          @{
            repository = $env:GITHUB_REPOSITORY
            commit = $env:GITHUB_SHA
            tag = $env:RELEASE_TAG
            run = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            dotnetSdk = (dotnet --version)
            node = (node --version)
            installer = $files[0].Name
            sha256 = $hash
          } | ConvertTo-Json | Out-File -Encoding utf8 BUILD-METADATA.json
      - name: Upload verified build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clef-release
          path: plugins/clef/dist/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No source checkout or repository build scripts run with these permissions.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download this run's verified build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: clef-release
          path: release
      - name: Verify transferred checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Attest installer build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.streamDeckPlugin
      - name: Create a new draft without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.streamDeckPlugin release/SHA256SUMS.txt release/BUILD-METADATA.json \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Clef $RELEASE_TAG" \
            --notes "Built from $GITHUB_SHA. Verify the installer with: gh attestation verify <installer> --repo $GITHUB_REPOSITORY. This is a draft pending Windows 11 and Apple Music testing."
