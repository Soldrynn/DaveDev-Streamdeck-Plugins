name: Build and test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release-check:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - clef
          - fivedeck
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/${{ matrix.plugin }}/package-lock.json

      - name: Set up .NET
        if: matrix.plugin == 'clef'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm ci

      - name: Verify registry signatures
        run: npm audit signatures

      - name: Build the plugin
        run: npm run build

      - name: Run checks
        run: npm run check

      - name: Validate the Stream Deck package
        run: npm run validate

      - name: Package the plugin
        run: npm run pack

      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.plugin }}-streamDeckPlugin
          path: plugins/${{ matrix.plugin }}/dist/*.streamDeckPlugin
          if-no-files-found: error
          retention-days: 14
